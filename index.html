(function(){

"use strict";

const DATA={

BIST:[

["THYAO","Türk Hava Yolları",312.40,.014],

["ASELS","Aselsan",178.20,.010],

["TUPRS","Tüpraş",164.70,-.005],

["AKBNK","Akbank",58.30,.004],

["SISE","Şişecam",49.80,-.007],

["BIMAS","BİM Mağazalar",612,.008]

],

NASDAQ:[

["NVDA","NVIDIA",176.20,.020],

["AAPL","Apple",210.40,.010],

["MSFT","Microsoft",512.10,.007],

["AMZN","Amazon",231.80,.005],

["TSLA","Tesla",329.40,-.010]

],

NYSE:[

["JPM","JPMorgan",298.20,.006],

["WMT","Walmart",99.80,.004],

["KO","Coca-Cola",71.40,.003],

["DIS","Disney",118.10,-.005]

]

};

let market="BIST";

let selected="THYAO";

let chartType="line";

let aiRunning=false;

let cash=100000;

let positions={};

let trades=[];

const stocks={};

Object.keys(DATA).forEach(m=>{

stocks[m]=DATA[m].map(x=>({

symbol:x[0],

name:x[1],

price:x[2],

trend:x[3],

history:[x[2]]

}));

});

const $=id=>document.getElementById(id);

const money=n=>

new Intl.NumberFormat(

"tr-TR",

{

style:"currency",

currency:"TRY",

maximumFractionDigits:2

}

).format(n);

const all=()=>Object.values(stocks).flat();

const get=s=>all().find(x=>x.symbol===s);

const list=()=>stocks[market];

const signal=s=>

s.trend>.006

?"AL"

:s.trend<-.005

?"SAT"

:"TUT";

function setStatus(text,type){

$("status").innerHTML=text;

$("status").className="status "+(type||"");

}

function portfolioValue(){

return cash+

Object.entries(positions)

.reduce(

(sum,[sym,qty])=>

sum+qty*get(sym).price,

0

);

}

function render(){

const s=get(selected);

if(!s)return;

$("title").textContent=

s.symbol+" — "+s.name;

$("meta").textContent=

market+" • Demo fiyat akışı";

$("ticker").innerHTML=

list().map(x=>`

<div class="tick">

<b>${x.symbol}</b>

${money(x.price)}

<br>

<small class="${x.trend>=0?"up":"down"}">

${x.trend>=0?"+":""}

${(x.trend*100).toFixed(2)}%

</small>

</div>

`).join("");

$("rows").innerHTML=

list().map(x=>`

<tr data-symbol="${x.symbol}">

<td><b>${x.symbol}</b></td>

<td>${x.name}</td>

<td>${money(x.price)}</td>

<td class="${x.trend>=0?"up":"down"}">

${x.trend>=0?"+":""}

${(x.trend*100).toFixed(2)}%

</td>

<td>${signal(x)}</td>

</tr>

`).join("");

document

.querySelectorAll("#rows tr")

.forEach(row=>{

row.onclick=()=>{

selected=row.dataset.symbol;

render();

};

});

const total=portfolioValue();

$("signal").textContent=signal(s);

$("signal").className=

"signal "+signal(s);

$("qty").textContent=

positions[selected]||0;

$("cash").textContent=

money(cash);

$("portfolio").textContent=

money(total);

$("pnl").textContent=

money(total-100000);

$("log").innerHTML=

trades.length

?

trades

.slice()

.reverse()

.map(t=>`

<div class="logitem ${t.action==="AL"?"al":"sat"}">

<b>

${t.action==="AL"?"🟢 AL":"🔴 SAT"}

— ${t.symbol}

</b>

<br>

${t.qty} adet × ${money(t.price)}

<br>

<small>

${t.reason}

<br>

${t.time}

</small>

</div>

`).join("")

:

"<div class='logitem'>Henüz işlem yok.</div>";

$("news").innerHTML=`

<div class="news">

<b>${s.name}</b>

demo analiz sonucu.

<small>

Trend:

${(s.trend*100).toFixed(2)}%

•

Sinyal:

${signal(s)}

</small>

</div>

<div class="news">

Gemini AI, seçili hisse ve demo piyasa verilerini analiz eder.

<small>

Gerçek yatırım tavsiyesi değildir.

</small>

</div>

`;

draw();

}

function draw(){

const c=$("chart");

const ctx=c.getContext("2d");

const s=get(selected);

const a=s.history;

const w=c.clientWidth||700;

const h=c.clientHeight||300;

const d=window.devicePixelRatio||1;

c.width=w*d;

c.height=h*d;

ctx.setTransform(d,0,0,d,0,0);

ctx.clearRect(0,0,w,h);

const min=Math.min(...a)*.997;

const max=Math.max(...a)*1.003;

const X=i=>

8+i*(w-16)/

Math.max(1,a.length-1);

const Y=v=>

10+

(max-v)/(max-min||1)*(h-25);

ctx.strokeStyle="#202a36";

for(let i=0;i<5;i++){

const y=

10+i*(h-20)/4;

ctx.beginPath();

ctx.moveTo(0,y);

ctx.lineTo(w,y);

ctx.stroke();

}

if(chartType==="line"){

ctx.beginPath();

a.forEach((v,i)=>

i

?ctx.lineTo(X(i),Y(v))

:ctx.moveTo(X(i),Y(v))

);

ctx.strokeStyle="#4b8dff";

ctx.lineWidth=2.5;

ctx.stroke();

}else{

for(let i=1;i<a.length;i++){

const up=a[i]>=a[i-1];

const x=X(i);

const y=Y(a[i]);

const yp=Y(a[i-1]);

ctx.strokeStyle=

up?"#19d18d":"#f05260";

ctx.fillStyle=ctx.strokeStyle;

ctx.beginPath();

ctx.moveTo(x,y-7);

ctx.lineTo(x,y+7);

ctx.stroke();

ctx.fillRect(

x-3,

Math.min(y,yp),

6,

Math.max(3,Math.abs(y-yp))

);

}

}

}

function trade(action,symbol,reason){

const s=get(symbol||selected);

const qty=10;

if(action==="AL"){

if(cash<s.price*qty){

setStatus(

"<b>AI:</b> Sanal bakiye yetersiz.",

"warn"

);

return false;

}

cash-=s.price*qty;

positions[s.symbol]=

(positions[s.symbol]||0)+qty;

}else{

if((positions[s.symbol]||0)<qty){

setStatus(

"<b>Satış:</b> Yeterli pozisyon yok.",

"warn"

);

return false;

}

cash+=s.price*qty;

positions[s.symbol]-=qty;

}

trades.push({

action,

symbol:s.symbol,

qty,

price:s.price,

reason,

time:new Date().toLocaleTimeString("tr-TR")

});

setStatus(

`<b>${action==="AL"?"🟢 ALIŞ":"🔴 SATIŞ"}</b>

— ${s.symbol} • ${money(s.price)} × ${qty}`,

"ok"

);

render();

return true;

}

/* GEMINI AI */

async function askGemini(){

const s=get(selected);

if(!s){

throw new Error("Seçili hisse bulunamadı.");

}

const marketData=all().map(x=>({

symbol:x.symbol,

name:x.name,

price:Number(x.price.toFixed(2)),

trend:Number((x.trend*100).toFixed(3)),

signal:signal(x)

}));

const prompt=`

Sen Türkçe konuşan bir borsa analiz asistanısın.

Bu uygulamadaki tüm veriler DEMO verileridir.

Gerçek zamanlı piyasa verisi değildir.

Gerçek yatırım tavsiyesi verme.

Seçili hisse:

${JSON.stringify({

symbol:s.symbol,

name:s.name,

price:Number(s.price.toFixed(2)),

trend:Number((s.trend*100).toFixed(3)),

signal:signal(s),

history:s.history

.slice(-20)

.map(x=>Number(x.toFixed(2)))

},null,2)}

Piyasa verileri:

${JSON.stringify(marketData,null,2)}

Portföy:

${JSON.stringify({

cash,

positions,

portfolioValue:portfolioValue()

},null,2)}

Şu formatta Türkçe ve kısa cevap ver:

KARAR: AL / SAT / TUT

GÜVEN: 0-100

ANALİZ: En fazla 3 kısa cümle.

RİSK: DÜŞÜK / ORTA / YÜKSEK

`;

const response=

await fetch("/api/chat",{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

message:prompt

})

});

let data={};

try{

data=await response.json();

}catch(e){

throw new Error(

"Sunucudan geçerli JSON cevabı alınamadı."

);

}

if(!response.ok){

throw new Error(

data.error||

data.message||

"Gemini API isteği başarısız oldu."

);

}

return (

data.answer||

data.reply||

"Gemini AI yanıt oluşturamadı."

);

}

function parseAI(text){

const normalized=

String(text).toUpperCase();

let decision="TUT";

if(

/KARAR\s*:\s*AL\b/.test(normalized)

){

decision="AL";

}else if(

/KARAR\s*:\s*SAT\b/.test(normalized)

){

decision="SAT";

}

return{

decision,

text

};

}

async function runRealAI(){

if(aiRunning){

return;

}

aiRunning=true;

$("ai").classList.add("running");

$("ai").textContent=

"⏳ GEMINI ANALİZ EDİYOR...";

setStatus(

"<b>🤖 Gemini AI:</b> Analiz yapılıyor..."

);

$("decision").textContent=

"Gemini AI analizi bekleniyor...";

try{

const result=

await askGemini();

const parsed=

parseAI(result);

const s=get(selected);

$("decision").textContent=

result;

$("signal").textContent=

parsed.decision;

$("signal").className=

"signal "+parsed.decision;

if(parsed.decision==="AL"){

setStatus(

"<b>🤖 GEMINI KARARI:</b> AL — Demo analiz tamamlandı.",

"ok"

);

}else if(parsed.decision==="SAT"){

setStatus(

"<b>🤖 GEMINI KARARI:</b> SAT — Demo analiz tamamlandı.",

"warn"

);

}else{

setStatus(

"<b>🤖 GEMINI KARARI:</b> TUT — Demo analiz tamamlandı."

);

}

$("news").innerHTML=`

<div class="news">

<b>🤖 Gemini AI Analizi — ${s.symbol}</b>

<br><br>

${String(result)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/\n/g,"<br>")}

</div>

<div class="news">

<b>⚠️ Demo Uyarısı</b>

<small>

Bu analiz yalnızca demo amaçlıdır ve yatırım tavsiyesi değildir.

</small>

</div>

`;

}catch(error){

console.error(

"Gemini API Hatası:",

error

);

$("decision").textContent=

"Gemini bağlantısı kurulamadı: "+

error.message;

setStatus(

"<b>❌ Gemini AI Hatası:</b> "+

error.message,

"warn"

);

}finally{

aiRunning=false;

$("ai").classList.remove("running");

$("ai").textContent=

"🤖 GEMINI AI ANALİZİ";

}

}

function tick(){

all().forEach(s=>{

s.price=Math.max(

.01,

s.price*

(

1+

s.trend/40+

(Math.random()-.5)*.004

)

);

s.history.push(s.price);

if(s.history.length>100){

s.history.shift();

}

});

if(!aiRunning){

render();

}

}

function reset(){

aiRunning=false;

cash=100000;

positions={};

trades=[];

all().forEach(s=>{

s.history=[s.price];

});

setStatus(

"<b>Demo:</b> Sıfırlandı."

);

$("decision").textContent=

"Henüz analiz yapılmadı.";

render();

}

$("ai").onclick=

runRealAI;

$("aiNav").onclick=()=>{

window.scrollTo({

top:0,

behavior:"smooth"

});

};
